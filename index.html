<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>جزوه کامل JavaScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="sidebar-overlay" onclick="closeSidebarMobile()"></div>
    <div id="console-overlay" onclick="closeConsoleMobile()"></div>

    <button id="sidebar-toggle" onclick="toggleSidebar()">◀</button>

    <div id="sidebar">
      <div id="sidebar-header">
        <h1>⚡ جزوه JavaScript</h1>
        <input
          id="search-box"
          type="text"
          placeholder="🔍 جستجو..."
          oninput="filterTopics(this.value)"
        />
      </div>
      <div id="topic-list"></div>
    </div>

    <div id="main">
      <div id="top-bar">
        <button id="mobile-sidebar-btn" onclick="openSidebarMobile()">
          ☰
        </button>
        <div style="flex: 1; min-width: 0">
          <div id="content-title">خوش اومدی 👋</div>
          <div id="content-sub">یه موضوع انتخاب کن</div>
        </div>
        <button id="mobile-console-btn" onclick="openConsoleMobile()">
          🖥️
        </button>
        <button class="top-btn" id="theme-btn" onclick="toggleTheme()">
          🌙
        </button>
        <button class="top-btn" id="run-btn" onclick="runCode()">▶ اجرا</button>
      </div>

      <div id="body-area">
        <div id="lesson">
          <div id="welcome">
            <div class="ic">⚡</div>
            <h2>جزوه کامل JavaScript</h2>
            <p>
              از متغیر تا OOP، از DOM تا Async — همه چیز اینجاست. موضوع انتخاب
              کن، توضیح بخون، کد اجرا کن!
            </p>
            <div class="scards">
              <div class="sc">
                <div class="n">۴۴+</div>
                <div class="l">موضوع</div>
              </div>
              <div class="sc">
                <div class="n">۲۰۰+</div>
                <div class="l">مثال کد</div>
              </div>
              <div class="sc">
                <div class="n">OOP</div>
                <div class="l">کامل</div>
              </div>
            </div>
          </div>
        </div>

        <div id="console-panel">
          <div id="con-hdr">
            <span><span class="con-dot"></span>Console</span>
            <button id="clear-btn" onclick="clearCon()">پاک</button>
          </div>
          <div id="con-out">
            <div class="cempty">
              <span style="font-size: 28px; opacity: 0.3">🖥️</span>
              <span>کنسول خالیه</span>
            </div>
          </div>
          <div id="con-input-area">
            <span>›</span>
            <input
              id="con-input"
              type="text"
              placeholder="کد بنویس → Enter"
              onkeydown="handleInput(event)"
              dir="ltr"
            />
          </div>
        </div>
      </div>
    </div>

    <button id="console-toggle-btn" onclick="toggleConsole()">▶</button>

    <a id="tg-badge" href="https://t.me/mohammad_dev_2012" target="_blank">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="white"
      >
        <path
          d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
        />
      </svg>
      @mohammad_dev_2012
    </a>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
